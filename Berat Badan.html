<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengukur Berat Badan</title>
</head>
<body>

    <h2 style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; text-align: center;">Pengukur Berat Badan</h2>
    <h3 style="font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;">Silahkan Isi Label Dibawah Ini!</h3>

    <form>
  <label for="Nama" style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">Nama:</label><br>
   <input type="text" id="Nama" value=""><br>
  <label for="Tinggi" style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">TinggiBadan(CM):</label><br>
   <input type="number" id="Tinggi" value=""><br>
  <label for="Berat" style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">BeratBadan(KG):</label><br>
   <input type="number" id="Berat" value=""><br>
  <label for="Gender" style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;">Gender:</label><br>
   <select id="Gender">
    <option value="Male">Male</option>
    <option value="Female">Female</option>
    <option value="Rahasia">Rahasia</option>
   </select>
   <br>

  <button type="button" onclick='
    var Nama = document.getElementById("Nama").value;
    var Tinggi = Number(document.getElementById("Tinggi").value);
    var Berat = Number(document.getElementById("Berat").value);
    var Gender = document.getElementById("Gender").value;
    var beratIdeal;

    if (Gender === "Male") {
        beratIdeal = (Tinggi - 100) - ((Tinggi - 100) * 0.10);
    } else {
        beratIdeal = (Tinggi - 100) - ((Tinggi - 100) * 0.15);
    }
    
    if (Gender === "Rahasia") {
        alert("Pilih Gender Male/Female")
        return;
    }
    var status = "";
    if (Berat < beratIdeal - 5) {
        status = "kurang dari ideal";
    } else if (Berat > beratIdeal + 5) {
        status = "lebih dari ideal";
    } else {
        status = "sudah ideal";
    }

    alert(
        "Halo " + Nama + ", berat badan idealmu sekitar " + beratIdeal.toFixed(1) +
        " kg. Status berat badanmu saat ini: " + status + "."
    );
  '>Hitung</button>
</form>

</body>
</html>
