<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perulangan</title>
</head>
<body>
    


     <h2 style="background-color: blue;">Perulangan</h2>

     <script>
   var nama = prompt("Masukkan Nama Anda");
   var jumlah = prompt("Masukkan Jumlah Perulangan Yang Anda Inginkan");
    if(nama === "" || nama === null) {
        alert("Nama Anda Salah");
    } else {
        alert("Selamat Datang Di Perulangan")
    }

    for(let i = 0; i < jumlah; i++) {
      document.write("<p>Welcome " + nama + "</p>");
    }




     </script>
</body>
</html>
